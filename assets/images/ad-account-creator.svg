<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">AD Account Creator application interface</title>
  <desc id="desc">A stylised desktop application showing account details, organisational unit options and a creation log.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="1" stop-color="#132b50"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5d9cff"/>
      <stop offset="1" stop-color="#67e8c1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#020712" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <circle cx="1040" cy="80" r="250" fill="#4f8ef7" opacity=".08"/>
  <circle cx="130" cy="720" r="260" fill="#63d6b0" opacity=".06"/>

  <g filter="url(#shadow)">
    <rect x="86" y="72" width="1028" height="616" rx="26" fill="#0b1628" stroke="#2a456b" stroke-width="2"/>
    <rect x="86" y="72" width="1028" height="70" rx="26" fill="#101f35"/>
    <rect x="86" y="116" width="1028" height="26" fill="#101f35"/>
    <circle cx="130" cy="107" r="8" fill="#ff6b6b"/>
    <circle cx="157" cy="107" r="8" fill="#ffd166"/>
    <circle cx="184" cy="107" r="8" fill="#67e8c1"/>
    <text x="230" y="116" fill="#edf4ff" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">AD Account Creator</text>
    <text x="986" y="115" fill="#7f94b3" font-family="Segoe UI, Arial, sans-serif" font-size="16">v4.0</text>

    <text x="132" y="190" fill="#67e8c1" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">ACCOUNT DETAILS</text>

    <g fill="#0f2139" stroke="#28486e">
      <rect x="132" y="215" width="252" height="56" rx="9"/>
      <rect x="404" y="215" width="252" height="56" rx="9"/>
      <rect x="132" y="302" width="524" height="56" rx="9"/>
      <rect x="132" y="389" width="252" height="56" rx="9"/>
      <rect x="404" y="389" width="252" height="56" rx="9"/>
    </g>
    <g fill="#7288a8" font-family="Segoe UI, Arial, sans-serif" font-size="13">
      <text x="146" y="207">FIRST NAME</text>
      <text x="418" y="207">LAST NAME</text>
      <text x="146" y="294">JOB TITLE</text>
      <text x="146" y="381">MANAGER</text>
      <text x="418" y="381">EXPIRY</text>
    </g>
    <g fill="#e9f1ff" font-family="Segoe UI, Arial, sans-serif" font-size="19">
      <text x="150" y="250">Alex</text>
      <text x="422" y="250">Morgan</text>
      <text x="150" y="337">IT Support Engineer</text>
      <text x="150" y="424">Search manager…</text>
      <text x="422" y="424">No expiry</text>
    </g>
    <circle cx="630" cy="243" r="13" fill="#163857" stroke="#67e8c1"/>
    <path d="m624 243 5 5 9-11" fill="none" stroke="#67e8c1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="708" y="190" fill="#5d9cff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">ORGANISATIONAL UNIT</text>
    <g font-family="Segoe UI, Arial, sans-serif" font-size="17">
      <g transform="translate(708 220)">
        <rect width="168" height="48" rx="9" fill="#19395e" stroke="#5d9cff"/>
        <rect x="17" y="14" width="20" height="20" rx="4" fill="#5d9cff"/>
        <path d="m21 24 4 4 8-10" fill="none" stroke="#fff" stroke-width="2.5"/>
        <text x="50" y="31" fill="#ecf3ff">Standard User</text>
      </g>
      <g transform="translate(894 220)">
        <rect width="168" height="48" rx="9" fill="#10233d" stroke="#28486e"/>
        <rect x="17" y="14" width="20" height="20" rx="4" fill="#0b1628" stroke="#42658e"/>
        <text x="50" y="31" fill="#9caec7">Contractor</text>
      </g>
      <g transform="translate(708 282)">
        <rect width="168" height="48" rx="9" fill="#10233d" stroke="#28486e"/>
        <rect x="17" y="14" width="20" height="20" rx="4" fill="#0b1628" stroke="#42658e"/>
        <text x="50" y="31" fill="#9caec7">Cargo</text>
      </g>
      <g transform="translate(894 282)">
        <rect width="168" height="48" rx="9" fill="#10233d" stroke="#28486e"/>
        <rect x="17" y="14" width="20" height="20" rx="4" fill="#0b1628" stroke="#42658e"/>
        <text x="50" y="31" fill="#9caec7">IT Department</text>
      </g>
    </g>

    <text x="708" y="382" fill="#67e8c1" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">GROUP PREVIEW</text>
    <rect x="708" y="405" width="354" height="122" rx="10" fill="#091426" stroke="#28486e"/>
    <g fill="#9db1cc" font-family="Consolas, monospace" font-size="14">
      <text x="726" y="435">Microsoft 365 Users</text>
      <text x="726" y="463">VPN Standard Access</text>
      <text x="726" y="491">IT Service Portal</text>
    </g>

    <rect x="132" y="501" width="524" height="92" rx="10" fill="#091426" stroke="#28486e"/>
    <text x="150" y="530" fill="#67e8c1" font-family="Consolas, monospace" font-size="14">✓ Username available</text>
    <text x="150" y="557" fill="#8ea4c2" font-family="Consolas, monospace" font-size="14">Ready to create account and mailbox.</text>

    <rect x="708" y="557" width="354" height="62" rx="11" fill="url(#accent)"/>
    <text x="885" y="596" text-anchor="middle" fill="#06101e" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" letter-spacing="1">CREATE ACCOUNT</text>
  </g>
</svg>
